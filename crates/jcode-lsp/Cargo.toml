[package]
name = "jcode-lsp"
version = "0.1.0"
edition = "2024"
description = "Generic multi-server LSP client layer for jcode: diagnostics on write, agent-facing navigation/refactoring"
publish = false

[lib]
name = "jcode_lsp"
path = "src/lib.rs"

[[bin]]
name = "fake-lsp"
path = "src/bin/fake_lsp.rs"

[dependencies]
anyhow = "1"
async-lsp = { version = "0.2", features = ["tokio"] }
futures = "0.3"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower = "0.5"
jcode-config-types = { path = "../jcode-config-types" }
jcode-logging = { path = "../jcode-logging" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
